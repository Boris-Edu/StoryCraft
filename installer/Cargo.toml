[package]
name = "storycraft-installer"
version = "4.2.0"
edition = "2021"
authors = ["Szymon Wolarz", "Boris-Edu"]
description = "StoryCraft Setup: a window over setupfiles/setup.py (based on the BadWords installer by Szymon Wolarz)"

[dependencies]
eframe = "0.27"
egui = "0.27"
egui_extras = { version = "0.27", features = ["all_loaders"] }
rfd = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
ureq = { version = "2.9", default-features = false, features = ["tls", "json"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
urlencoding = "2.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
